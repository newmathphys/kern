<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="KERN - zero-trust verification gateway, measured baseline">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <style>
      .title { font: 700 92px DejaVu Sans Mono, ui-monospace, monospace; fill: #f0f6fc; letter-spacing: 4px; }
      .sub   { font: 400 21px DejaVu Sans Mono, ui-monospace, monospace; fill: #8b949e; }
      .badge { font: 600 18px DejaVu Sans Mono, ui-monospace, monospace; fill: #3fb950; }
      .hdr   { font: 700 19px DejaVu Sans Mono, ui-monospace, monospace; fill: #c9d1d9; letter-spacing: 1px; }
      .val   { font: 700 27px DejaVu Sans Mono, ui-monospace, monospace; fill: #3fb950; }
      .lbl   { font: 400 17px DejaVu Sans Mono, ui-monospace, monospace; fill: #8b949e; }
      .node  { font: 700 20px DejaVu Sans Mono, ui-monospace, monospace; fill: #f0f6fc; }
    </style>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>

  <text x="56" y="128" class="title">KERN</text>
