  <rect x="56" y="306" width="1168" height="182" rx="6" fill="#0d1117" stroke="#238636" stroke-width="1.5"/>
  <text x="76" y="336" class="hdr">MEASURED BASELINE</text>
  <text x="76" y="386" class="val">279 / 279</text>
  <text x="240" y="386" class="lbl">core tests (Debug + ReleaseSafe)</text>
  <text x="76" y="424" class="val">95.0 %</text>
  <text x="240" y="424" class="lbl">mutation score (38/40 killed, 2 equivalent)</text>
  <text x="76" y="462" class="val">79 / 79</text>
  <text x="240" y="462" class="lbl">can-fail CHECK targets (94 non-vacuous cases)</text>
  <text x="700" y="386" class="val">42 / 0</text>
  <text x="820" y="386" class="lbl">Lean 4 theorems / 0 sorry</text>
  <text x="700" y="424" class="val">100.0 %</text>
  <text x="820" y="424" class="lbl">decision coverage (30/30)</text>
  <text x="700" y="462" class="val">240/4/0</text>
  <text x="820" y="462" class="lbl">QEMU ARM64+PPC64 passed/skip/fail</text>

  <text x="56" y="540" class="node">github.com/newmathphys/kern</text>
  <text x="56" y="576" class="lbl">POLYFORM NONCOMMERCIAL 1.0.0 / (c) 2026 VITAL KALINOUSKY</text>
