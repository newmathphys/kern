<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 290" width="100%" height="290" role="img" aria-label="KERN architecture and measured baseline">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <style>
      .title { font: 700 30px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #f0f6fc; letter-spacing: 1.5px; }
      .sub   { font: 400 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #8b949e; }
      .badge { font: 600 11px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #3fb950; }
      .hdr   { font: 700 11.5px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #c9d1d9; letter-spacing: 0.5px; }
      .val   { font: 700 13.5px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #3fb950; }
      .lbl   { font: 400 11px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #8b949e; }
      .node  { font: 700 11.5px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #f0f6fc; text-anchor: middle; }
    </style>
  </defs>

  <rect width="960" height="290" rx="10" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Header: 2 lines, each measured to fit inside 960px -->
  <text x="32" y="48" class="title">KERN</text>
  <rect x="128" y="29" width="186" height="22" rx="4" fill="#0f2d1e" stroke="#238636" stroke-width="1"/>
  <text x="138" y="44" class="badge">ZIG 0.17 / Z3 / LEAN 4</text>
  <text x="32" y="72" class="sub">L0-L5 verification gateway / sealed .kimg container</text>
  <text x="32" y="89" class="sub">Belnap B4 truth gate / C-ABI (8 fn) / HTTP guardrail</text>

  <!-- Panel 1: Belnap B4 lattice -->
  <rect x="32" y="104" width="215" height="152" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="48" y="125" class="hdr">BELNAP B4 ACCUMULATOR</text>
  <line x1="139" y1="148" x2="99" y2="182" stroke="#f85149" stroke-width="1.5"/>
  <line x1="139" y1="148" x2="179" y2="182" stroke="#3fb950" stroke-width="1.5"/>
  <line x1="99" y1="182" x2="139" y2="216" stroke="#484f58" stroke-width="1.5"/>
  <line x1="179" y1="182" x2="139" y2="216" stroke="#484f58" stroke-width="1.5"/>
  <circle cx="139" cy="148" r="12" fill="#3d1318" stroke="#f85149" stroke-width="1.5"/>
  <text x="139" y="152" class="node">B</text>
  <circle cx="99" cy="182" r="12" fill="#161b22" stroke="#f85149" stroke-width="1.2"/>
  <text x="99" y="186" class="node">F</text>
  <circle cx="179" cy="182" r="12" fill="#0f2d1e" stroke="#3fb950" stroke-width="1.2"/>
  <text x="179" y="186" class="node">T</text>
  <circle cx="139" cy="216" r="12" fill="#161b22" stroke="#6e7681" stroke-width="1.2"/>
  <text x="139" y="220" class="node">N</text>
  <text x="48" y="245" class="lbl">200 T / 422 F,N / 409 B</text>

  <path d="M 247 180 L 275 180" stroke="#30363d" stroke-width="2"/>

  <!-- Panel 2: L0-L5 engine -->
  <rect x="275" y="104" width="325" height="152" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="291" y="125" class="hdr">L0-L5 ENGINE AND TRUTH GATE</text>
  <rect x="291" y="136" width="293" height="58" rx="4" fill="#161b22" stroke="#21262d"/>
  <text x="303" y="154" class="badge">L0-L2: .kimg + KERNFS + Merkle</text>
  <text x="303" y="171" class="lbl">BLAKE3 default / raw ~90 GB/s</text>
  <text x="303" y="186" class="lbl">safe 300 MB/s / SIMD-8 1.2 GB/s</text>
  <rect x="291" y="202" width="293" height="50" rx="4" fill="#161b22" stroke="#21262d"/>
  <text x="303" y="220" class="badge">L3-L5: Z3 bridge (5 theories) + Lean 4</text>
  <text x="303" y="237" class="lbl">external checker verdict: e=1 | e=0</text>

  <path d="M 600 180 L 628 180" stroke="#30363d" stroke-width="2"/>

  <!-- Panel 3: measured baseline -->
  <rect x="628" y="104" width="300" height="152" rx="6" fill="#0d1117" stroke="#238636" stroke-width="1.2"/>
  <text x="644" y="125" class="hdr">MEASURED BASELINE</text>
  <text x="644" y="150" class="val">279 / 279</text>
  <text x="742" y="150" class="lbl">core x86_64 (QEMU rerun)</text>
  <text x="644" y="172" class="val">42 / 0</text>
  <text x="742" y="172" class="lbl">Lean 4 theorems / 0 sorry</text>
  <text x="644" y="194" class="val">100.0%</text>
  <text x="742" y="194" class="lbl">decision coverage (30/30)</text>
  <text x="644" y="216" class="val">95.0%</text>
  <text x="742" y="216" class="lbl">mutation score / 1M fuzz</text>
  <text x="644" y="238" class="val">81 / 81</text>
  <text x="742" y="238" class="lbl">can-fail CHECK targets</text>
</svg>
