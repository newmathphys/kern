<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="KERN: zero-trust verification gateway">
  <title>KERN &#8212; zero-trust L0&#8211;L5 verification gateway</title>
  <style>
    .t  { font: 700 46px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #e6edf3; }
    .s  { font: 20px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8b949e; }
    .n  { font: 700 40px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #58a6ff; }
    .l  { font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8b949e; }
  </style>
  <rect width="1200" height="630" fill="#0d1117"/>
  <rect x="0" y="0" width="1200" height="6" fill="#58a6ff"/>
  <text x="64" y="118" class="t">KERN</text>
  <text x="64" y="162" class="s">Zero-trust verification gateway for AI-generated code</text>
  <text x="64" y="196" class="l">Zig 0.17 &#183; Z3 &#183; Belnap B4 &#183; BLAKE3/Ed25519 &#183; MCP</text>
  <g>
    <text x="64" y="300" class="n">147</text><text x="64" y="326" class="l">Lean 4 theorems, 0 sorry</text>
    <text x="340" y="300" class="n">38/38</text><text x="340" y="326" class="l">CI stages, mutation-tested</text>
    <text x="640" y="300" class="n">266</text><text x="640" y="326" class="l">fault-injection cases</text>
    <text x="880" y="300" class="n">9</text><text x="880" y="326" class="l">MCP tools</text>
  </g>
  <g>
    <text x="64" y="420" class="n">70/70</text><text x="64" y="446" class="l">full-spectrum corpus</text>
    <text x="340" y="420" class="n">0</text><text x="340" y="446" class="l">false alarms on packaging, semver, dateutil</text>
    <text x="640" y="420" class="n">trusted: 0</text><text x="640" y="446" class="l">proofs re-checked by the Zig kernel</text>
  </g>
  <text x="64" y="540" class="s">pytest passes the patch. KERN blocks it: Z3 counterexample + CPython replay.</text>
  <text x="64" y="580" class="l">github.com/newmathphys/kern &#183; newmathphys.github.io/kern/playground/</text>
</svg>
