# KERN CI (GitHub Actions).
#
# ЗАЧЕМ: за одну сессию найдено 21 дефект, из них 11 «молчаливо сломанных
# проверок». Без автоматизации они вернутся при первом же рефакторинге.
#
# Контур: build -> test -> test-next -> эшелоны -> Lean -> canfail (вкл. мета).
# Красный CI = мержить нельзя.
name: KERN CI

on:
  push:
    branches: [ main, zig-0.17-migration ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Zig 0.17 (ветка zig-0.17-migration). Действие ставит нужную версию.
      - name: Установка Zig 0.17.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # z3 нужен для SMT-теорий и kernc prove; ставится через pip (без apt).
      - name: z3-solver (без системного apt)
        run: pip install -r requirements.txt

      - name: "CI-контур (быстрый: без Lean/canfail)"
        run: ./tools/ci.sh --fast

      # CAN-FAIL в этом контуре НЕ гоняет кейс `lean-sorry`: он требует Lean,
      # которого здесь СОЗНАТЕЛЬНО нет (внешний установщик ронял весь контур на
      # 17-й секунде при шторме CDN). Кейс живёт в job `formal-lean`, где Lean
      # есть — поэтому он НЕ выпадает из проверки и НЕ становится вакуумным.
      - name: CAN-FAIL (проверки СПОСОБНЫ упасть, вкл. мета; без Lean-кейса)
        run: |
          python3 tools/canfail.py --selftest
          python3 tools/canfail.py --skip lean-sorry

  # ---------------------------------------------------------------------------
  # ОТДЕЛЬНЫЙ контур формальных доказательств (дефект #528).
  # ЗАЧЕМ ОТДЕЛЬНО. ИЗМЕРЕНО 2026-11-08: при шторме CDN GitHub (релизные ассеты
  # отдавали HTTP 504; установщик `elan-init.sh` внутри сам качает бинарник с
  # GitHub Releases и падал с 504) шаг «Lean 4 (elan)» умирал на 17-й секунде и
  # красил ВЕСЬ `verify` — включая проверки, к которым Lean не имеет отношения.
  # Теперь Lean изолирован: его сетевой отказ виден по имени job'а, а контур
  # кода (быстрый контур + CAN-FAIL) идёт независимо.
  # Кэш `~/.elan` по хешу `lean-toolchain`: после первого успешного прогона
  # внешний CDN не нужен вовсе.
  formal-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Кэш Lean 4 (elan)
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}

      - name: Lean 4 (elan, с повторами)
        run: |
          set -euo pipefail
          if [ -x "$HOME/.elan/bin/lean" ]; then
            echo "[i] elan из кэша — внешняя сеть не нужна"
          else
            ok=0
            for attempt in 1 2 3 4 5; do
              echo "[i] установка elan, попытка $attempt/5"
              if curl -sSfL --retry 5 --retry-all-errors --retry-delay 10 \
                   --max-time 300 \
                   https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
                 | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"; then
                ok=1; break
              fi
              echo "[!] попытка $attempt не удалась (сеть/CDN) — пауза 30 с"; sleep 30
            done
            [ "$ok" = 1 ] || { echo "[!] elan не установился за 5 попыток — это СЕТЕВОЙ отказ CDN GitHub, а не дефект кода" >&2; exit 1; }
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Mathlib (prebuilt cache)
        run: ./formal/setup_mathlib.sh "$HOME/mathlib_proj"

      - name: Lean 4 (0 errors, 0 sorry)
        env:
          KERN_REQUIRE_MATHLIB: "1"
        run: ./formal/check.sh

      # КЕЙС `lean-sorry` ГОНЯЕТСЯ ЗДЕСЬ — там, где Lean реально есть.
      - name: "CAN-FAIL: кейс Lean (проверка способна упасть)"
        run: python3 tools/canfail.py --only lean-sorry

  # 0K.11: кросс-сборка C-ABI под macOS. Ядро (kernc) для macOS не собирается:
  # шаг `install` тянет `kernx`, который линкуется с системным sqlite3, а его
  # нет в кросс-тулчейне. Поэтому гейт проверяет ровно то, что работает —
  # библиотеку. Windows не поддерживается: блокеры перечислены в docs/PLATFORMS.md.
  cross-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Установка Zig 0.17.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: libkern для aarch64-macos
        run: zig build lib -Dtarget=aarch64-macos --prefix /tmp/kern-cross-mac
      - name: артефакт существует
        run: test -f /tmp/kern-cross-mac/lib/libkern.dylib
