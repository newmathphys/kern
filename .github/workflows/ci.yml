# KERN CI (GitHub Actions).
#
# ЗАЧЕМ: за одну сессию найдено 21 дефект, из них 11 «молчаливо сломанных
# проверок». Без автоматизации они вернутся при первом же рефакторинге.
#
# Контур: build -> test -> test-next -> эшелоны -> Lean -> canfail (вкл. мета).
# Красный CI = мержить нельзя.
name: KERN CI

on:
  push:
    branches: [ main, zig-0.17-migration ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Zig 0.17 (ветка zig-0.17-migration). Действие ставит нужную версию.
      - name: Установка Zig 0.17.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # z3 нужен для SMT-теорий и kernc prove; ставится через pip (без apt).
      - name: z3-solver (без системного apt)
        run: pip install -r requirements.txt

      # Lean 4 + Mathlib для формальных доказательств (7 файлов, 0 sorry).
      # ЗАЩИТА ОТ СЕТЕВЫХ СБОЕВ CDN (ИЗМЕРЕНО 2026-11-08): шаг падал на 17-й
      # секунде, потому что `curl … elan-init.sh` обрывался на шторме CDN
      # (в тот же час релизные ассеты отдавали HTTP 504). Два независимых
      # лечения: (1) КЭШ `~/.elan` по хешу `lean-toolchain` — при попадании
      # во внешний CDN не ходим вовсе; (2) ТРИ попытки установки с
      # `--retry 5 --retry-all-errors`, чтобы кратковременный 502/504 не
      # красил весь контур.
      - name: Кэш Lean 4 (elan)
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}

      - name: Lean 4 (elan, с повторами)
        run: |
          set -euo pipefail
          if [ -x "$HOME/.elan/bin/lean" ]; then
            echo "[i] elan из кэша — внешняя сеть не нужна"
          else
            ok=0
            for attempt in 1 2 3; do
              echo "[i] установка elan, попытка $attempt/3"
              if curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 \
                   --max-time 300 \
                   https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
                 | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"; then
                ok=1; break
              fi
              echo "[!] попытка $attempt не удалась (сеть/CDN) — пауза 15 с"; sleep 15
            done
            [ "$ok" = 1 ] || { echo "[!] elan не установился за 3 попытки — это СЕТЕВОЙ отказ, а не дефект кода" >&2; exit 1; }
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: "CI-контур (быстрый: без Lean/canfail)"
        run: ./tools/ci.sh --fast

      # Lean и canfail — самая долгая часть; запускаются отдельно,
      # чтобы падение было видно по имени стадии.
      #
      # Mathlib: 5 из 7 файлов импортируют Mathlib. Собирать его из исходников
      # часами нельзя, поэтому берём ПРЕДСОБРАННЫЙ кэш (lake exe cache get).
      - name: Mathlib (prebuilt cache)
        run: ./formal/setup_mathlib.sh "$HOME/mathlib_proj"

      # KERN_REQUIRE_MATHLIB=1: если Mathlib недоступен, стадия ПАДАЕТ,
      # а не рапортует «0 errors, 0 sorry» по 2 из 7 файлов.
      - name: Lean 4 (0 errors, 0 sorry)
        env:
          KERN_REQUIRE_MATHLIB: "1"
        run: ./formal/check.sh

      - name: CAN-FAIL (проверки СПОСОБНЫ упасть, вкл. мета)
        run: |
          python3 tools/canfail.py --selftest
          python3 tools/canfail.py

  # 0K.11: кросс-сборка C-ABI под macOS. Ядро (kernc) для macOS не собирается:
  # шаг `install` тянет `kernx`, который линкуется с системным sqlite3, а его
  # нет в кросс-тулчейне. Поэтому гейт проверяет ровно то, что работает —
  # библиотеку. Windows не поддерживается: блокеры перечислены в docs/PLATFORMS.md.
  cross-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Установка Zig 0.17.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: libkern для aarch64-macos
        run: zig build lib -Dtarget=aarch64-macos --prefix /tmp/kern-cross-mac
      - name: артефакт существует
        run: test -f /tmp/kern-cross-mac/lib/libkern.dylib
