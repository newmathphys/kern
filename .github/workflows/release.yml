name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Zig 0.17.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build hermetic binary
        run: zig build hermetic

      - name: Package release assets
        run: |
          cp zig-out/bin/kernc-hermetic kernc-x86_64-linux-musl
          sha256sum kernc-x86_64-linux-musl > SHA256SUMS
          cat SHA256SUMS

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/RELEASE_NOTES_${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTES" ]; then
            NOTES=$(ls docs/RELEASE_NOTES_v*.md | sort -V | tail -1)
            echo "[i] свои notes для $GITHUB_REF_NAME не найдены — беру $NOTES"
          fi
          # Порядок важен: черновик -> ассеты -> публикация. Если публиковать
          # до загрузки, релиз существует БЕЗ файлов, и ссылки
          # releases/download/<tag>/... отдают 404 при непустой странице релиза.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "KERN $GITHUB_REF_NAME" \
              --notes-file "$NOTES" --draft
          gh release upload "$GITHUB_REF_NAME" \
            kernc-x86_64-linux-musl SHA256SUMS --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
