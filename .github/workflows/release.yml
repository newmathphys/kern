name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Zig 0.17.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build hermetic binary
        run: zig build hermetic

      # АРХИВ АППЛАЕНСА НУЖЕН ПИТОНУ И БЭКЕНДУ: `kerna` (PyInstaller onefile) +
      # `zig-out/bin/kernc`. Без этого шага в релизе был бы только ОДИН бинарь
      # (`kernc`), а `action.yml` качает `kerna-dist` — то есть ссылался бы в
      # пустоту (класс #497: обещание без артефакта).
      - name: Build the verifier backend (kernc) for the appliance
        run: zig build

      - name: Python toolchain for the appliance (z3 + PyInstaller)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r requirements.txt pyinstaller
          .venv/bin/python -c 'import z3, PyInstaller; print("[i] z3 + PyInstaller готовы")'

      - name: Build kerna (onefile) and the release archive
        run: |
          PYTHON=.venv/bin/python make kerna-build PYTHON=.venv/bin/python
          PYTHON=.venv/bin/python make kerna-dist
          ls -la dist-release

      # ГЕЙТ ПЕРЕД ПУБЛИКАЦИЕЙ: публикуется ровно тот архив, шаги которого
      # исполнены и проверены (`make action-check REAL=1` — сухой прогон
      # action.yml на ЭТОМ архиве, с настоящим SHA-256).
      - name: Gate the artifact before publishing
        run: PYTHON=.venv/bin/python make action-check REAL=1

      - name: Package release assets
        run: |
          VER="$(python3 -c 'import json;print(json.load(open("server.json"))["version"])')"
          cp zig-out/bin/kernc-hermetic kernc-x86_64-linux-musl
          # ОДИН SHA256SUMS НА ВСЕ АССЕТЫ: `action.yml` берёт из него строку
          # архива и сверяет ДО распаковки — поэтому имя в строке обязано быть
          # ГОЛЫМ (`kerna-dist-v<ver>.tar.gz`), без каталога `dist-release/`.
          # ДЕФЕКТ, ПОЙМАННЫЙ ЭТИМ ЖЕ ШАГОМ на первом прогоне v2.8.2: путь
          # передавался с каталогом, строка получалась
          # `…  dist-release/kerna-dist-v2.8.2.tar.gz`, и проверка ниже
          # (`grep " kerna-dist-v…$"`) законно падала — релиз НЕ публиковался
          # (лучше красный прогон, чем архив, который Action не сможет сверить).
          { sha256sum kernc-x86_64-linux-musl
            ( cd dist-release && sha256sum "kerna-dist-v${VER}.tar.gz" ); } > SHA256SUMS
          cat SHA256SUMS
          test -s "dist-release/kerna-dist-v${VER}.tar.gz" || { echo "[!] нет архива"; exit 1; }
          grep -q " kerna-dist-v${VER}.tar.gz$" SHA256SUMS || { echo "[!] сумма архива не попала в SHA256SUMS"; exit 1; }

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="$(python3 -c 'import json;print(json.load(open("server.json"))["version"])')"
          NOTES="docs/RELEASE_NOTES_${GITHUB_REF_NAME}.md"
          # ДЕФЕКТ #507: ТИХИЙ ФОЛБЭК НА ЧУЖИЕ ЗАМЕТКИ. Раньше при отсутствии
          # файла для тега брался последний по версии (`v2.7.2`), и страница
          # релиза описывала ДРУГОЙ релиз — ровно класс #370 («сообщение говорит
          # не то, что произошло»). Теперь это ОТКАЗ с названной причиной.
          if [ ! -f "$NOTES" ]; then
            echo "::error::нет $NOTES — релиз $GITHUB_REF_NAME не будет описан чужими заметками"
            echo "[!] создайте $NOTES (образец: docs/RELEASE_NOTES_v2.8.2.md) и перезапустите"
            exit 1
          fi
          # Порядок важен: черновик -> ассеты -> публикация. Если публиковать
          # до загрузки, релиз существует БЕЗ файлов, и ссылки
          # releases/download/<tag>/... отдают 404 при непустой странице релиза.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "KERN $GITHUB_REF_NAME" \
              --notes-file "$NOTES" --draft
          gh release upload "$GITHUB_REF_NAME" \
            kernc-x86_64-linux-musl SHA256SUMS \
            "dist-release/kerna-dist-v${VER}.tar.gz" \
            kern.intoto.jsonl kern.intoto.sig --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false

