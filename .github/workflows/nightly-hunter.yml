# НОЧНОЙ ОХОТНИК (окно №22): автономный поиск ФИЗИЧЕСКИ подтверждённых багов.
#
# ЗАЧЕМ. KERN силён там, где деньги и числа: переполнение i32/u64, деление на
# ноль при нулевой ликвидности, выход за границы буфера. Прогон идёт на
# бесплатном раннере GitHub — ПК выключен, время 03:17 UTC.
#
# ПРАВИЛО БЕЗОПАСНОСТИ. В чужие репозитории мы НЕ пишем ничего: отчёт падает
# только в наш собственный Issue с меткой `nightly-trophy`. Автоматические
# issue в чужих репо запрещены правилами GitHub; человек читает находку и
# отправляет её сам (так работают Project Zero / Trail of Bits).
name: nightly-hunter

on:
  # ВАЖНО (наблюдение 18.11.2026): одиночный cron 03:17 UTC НЕ сработал ни
  # разу, хотя workflow был active, файл лежал на default-ветке, репозиторий
  # не форк. Планировщик GitHub — best-effort и под нагрузкой пропускает
  # запуски. Поэтому два окна: если одно пропущено, второе доберёт ночь.
  schedule:
    - cron: '17 3 * * *'
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      custom_repos:
        description: 'owner/name,... (пусто = авто-поиск по темам)'
        required: false
        default: ''
      max_repos:
        description: 'сколько мишеней за ночь'
        required: false
        default: '5'

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-hunter
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - name: Установка Zig 0.17.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: z3-solver
        run: pip install -r requirements.txt

      # kernc нужен для `--xray`/`--xray-none`; gcc уже есть на раннере (UBSan).
      - name: Сборка kernc
        run: zig build

      - name: Самотест охотника
        run: python3 tools/nightly_hunter.py --selftest

      - name: Охота (шард ${{ matrix.shard }}/4)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Пустой custom_repos НЕ передаём вовсе: иначе argparse видит
          # `--repos` без значения и падает (баг шарда 0, охота 44288160086).
          ARGS=(--max-repos "${{ inputs.max_repos || '20' }}" \
                --shard "${{ matrix.shard }}/4" \
                --out "nightly-out-${{ matrix.shard }}")
          if [ -n "${{ inputs.custom_repos }}" ]; then
            ARGS+=(--repos "${{ inputs.custom_repos }}")
          fi
          python3 tools/nightly_hunter.py "${ARGS[@]}"

      - name: Артефакты улова
        uses: actions/upload-artifact@v4
        with:
          name: nightly-hunter-${{ matrix.shard }}
          path: nightly-out-${{ matrix.shard }}/
          if-no-files-found: warn

  # СВОДНЫЙ ДЖОБ (Окно №28): 4 шарда пишут независимые отчёты, Issue создаётся
  # РОВНО ОДИН раз и только если суммарно есть физически подтверждённые трофеи.
  trophies:
    needs: hunt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nightly-hunter-*
          path: merged

      - name: Сводка шардов
        run: |
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path("merged")
          totals = {}
          artifacts = 0
          parts, shards = [], 0
          for f in sorted(root.rglob("report.json")):
              d = json.loads(f.read_text(encoding="utf-8"))
              shards += 1
              for k, v in (d.get("counts") or {}).items():
                  totals[k] = totals.get(k, 0) + v
              artifacts += d.get("type_artifacts", 0)
          for f in sorted(root.rglob("report.md")):
              parts.append(f.read_text(encoding="utf-8"))
          head = "# Nightly hunt report (merged %d shards)" % shards
          stats = "CONFIRMED: %d | RUNTIME_CONFIRMED: %d | SMT_CANDIDATE: %d | type_artifacts: %d" % (
              totals.get("CONFIRMED", 0), totals.get("RUNTIME_CONFIRMED", 0),
              totals.get("SMT_CANDIDATE", 0), artifacts)
          pathlib.Path("merged/report.md").write_text(
              head + "\n\n" + stats + "\n\n" + "\n".join(parts), encoding="utf-8")
          pathlib.Path("merged/counts.json").write_text(json.dumps(totals), encoding="utf-8")
          print(stats)
          PY

      - name: Трофей -> Issue (ровно один)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CONF=$(python3 -c "import json;d=json.load(open('merged/counts.json'));print(d.get('CONFIRMED',0)+d.get('RUNTIME_CONFIRMED',0))")
          echo "confirmed=$CONF"
          if [ "$CONF" -gt 0 ]; then
            gh label create nightly-trophy --color B60205 -R "${{ github.repository }}" \
              --description "Физически подтверждённая находка ночного охотника" 2>/dev/null || true
            gh issue create -R "${{ github.repository }}" \
              --title "nightly-trophy: $CONF подтверждённых находок $(date -u +%Y-%m-%d)" \
              --label nightly-trophy \
              --body-file merged/report.md
          else
            echo "Подтверждённых находок нет — Issue не создаётся (нулевой шум)."
          fi
