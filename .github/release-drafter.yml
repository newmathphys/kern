# ДЕФЕКТ #248: черновик назывался `v$NEXT_PATCH_VERSION`, то есть ТЕМ ЖЕ тегом,
# которым управляет workflow Release. `gh release view` находил этот черновик,
# загружал в него ассеты и НЕ публиковал: тег оставался без релиза, а ссылки
# releases/download/<tag>/... отдавали 404 при непустой странице «релиза».
# Черновик «что войдёт в следующий релиз» не должен занимать имя тега.
name-template: 'Unreleased (next)'
tag-template: 'next'
categories:
  - title: '🚀 Features and capabilities'
    labels: ['enhancement', 'feature']
  - title: '🛡️ Verification and security'
    labels: ['verification', 'security', 'formal-verification']
  - title: '🐛 Bug fixes'
    labels: ['bug', 'fix']
  - title: '🧪 Formal verification (Lean 4)'
    labels: ['lean', 'lean4']
  - title: '⚙️ Tooling (contracts, mutator, harness)'
    labels: ['tooling', 'ci']
  - title: '📊 Metrics and evidence'
    labels: ['metrics', 'evidence', 'documentation']
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'
no-changes-template: '- No changes in this range.'
version-resolver:
  major:
    labels: ['major', 'breaking']
  minor:
    labels: ['minor', 'enhancement', 'feature']
  patch:
    labels: ['patch', 'bug', 'fix', 'documentation', 'tooling']
  default: patch
template: |
  ## What changed

  $CHANGES

  ## Evidence

  KERN's rule: **a claim is admitted only with machine evidence.** Before using this
  release, check the numbers yourself:

  ```bash
  zig build test                              # the full core suite
  make canfail                                # every CHECK target provably able to fail
  python3 tools/slsa_provenance.py --check    # Ed25519 signature + source fingerprint
  ```

  The release binary is verified against `SHA256SUMS`:

  ```bash
  curl -fsSLO https://github.com/newmathphys/kern/releases/download/$RESOLVED_VERSION/kernc-x86_64-linux-musl
  curl -fsSLO https://github.com/newmathphys/kern/releases/download/$RESOLVED_VERSION/SHA256SUMS
  sha256sum -c SHA256SUMS
  ```

  See `docs/CAPABILITY_STATUS.en.md` for what is measured, what is not implemented, and
  the full defect registry (including the defects this project found in itself).
