# KERN — локальный стенд: ядро + (опционально) Z3 уже внутри образа.
# Статус: оболочка (не запускалась — нет docker в текущем окружении).
services:
  kern:
    build: .
    image: kern:1.3
    volumes:
      - ./examples:/kern/examples:ro
    command: ["check-integrity", "/kern/tests/fixtures/valid_v1_3.kimg"]
  kern-verify:
    image: kern:1.3
    volumes:
      - ./tests:/kern/tests:ro
    command: ["verify", "/kern/tests/fixtures/valid_v1_3.kimg"]
    profiles: ["verify"]
