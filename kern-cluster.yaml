# KERN — K8s манифест с автомасштабированием (§ «Cloud-Native KERN»).
# Статус: оболочка (не применялась к кластеру).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kern-verifier
spec:
  replicas: 2
  selector:
    matchLabels: { app: kern-verifier }
  template:
    metadata:
      labels: { app: kern-verifier }
    spec:
      containers:
        - name: kern
          image: kern:1.3
          command: ["/usr/local/bin/kernc"]
          args: ["verify", "/kern/tests/fixtures/valid_v1_3.kimg"]
          resources:
            requests: { cpu: "100m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kern-verifier-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kern-verifier
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
